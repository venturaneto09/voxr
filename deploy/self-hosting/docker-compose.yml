name: voxr

x-voxr-postgres-env: &voxr-postgres-env
  VOXR_DATABASE_BACKEND: postgres
  VOXR_POSTGRES_HOST: ${VOXR_POSTGRES_HOST:-postgres}
  VOXR_POSTGRES_PORT: "${VOXR_POSTGRES_PORT:-5432}"
  VOXR_POSTGRES_DATABASE: ${VOXR_POSTGRES_DATABASE:-voxr}
  VOXR_POSTGRES_USERNAME: ${VOXR_POSTGRES_USERNAME:-voxr}
  VOXR_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  VOXR_POSTGRES_SSL: "${VOXR_POSTGRES_SSL:-false}"
  VOXR_POSTGRES_PREPARED_STATEMENTS: ${VOXR_POSTGRES_PREPARED_STATEMENTS:-true}

x-voxr-env: &voxr-env
  <<: *voxr-postgres-env
  VOXR_ENV: production
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  VOXR_SELF_HOSTED: "true"
  VOXR_BASE_DOMAIN: ${VOXR_DOMAIN:?set VOXR_DOMAIN in .env}
  VOXR_PUBLIC_SCHEME: ${VOXR_PUBLIC_SCHEME:-https}
  VOXR_PUBLIC_PORT: ${VOXR_PUBLIC_PORT:-443}
  VOXR_PUBLIC_ORIGIN: ${VOXR_PUBLIC_ORIGIN:-}
  VOXR_TRUST_CLIENT_IP_HEADER: "${VOXR_TRUST_CLIENT_IP_HEADER:-true}"
  VOXR_CLIENT_IP_HEADER_NAME: ${VOXR_CLIENT_IP_HEADER_NAME:-x-forwarded-for}
  VOXR_API_HEADERS_TIMEOUT_MS: ${VOXR_API_HEADERS_TIMEOUT_MS:-30000}
  VOXR_API_REQUEST_TIMEOUT_MS: ${VOXR_API_REQUEST_TIMEOUT_MS:-120000}

  VOXR_KV_URL: ${VOXR_KV_URL:-redis://valkey:6379/0}
  VOXR_NATS_URL: ${VOXR_NATS_URL:-nats://nats:4222}
  VOXR_NATS_JETSTREAM_URL: ${VOXR_NATS_JETSTREAM_URL:-${VOXR_NATS_URL:-nats://nats:4222}}
  VOXR_NATS_AUTH_TOKEN: ${VOXR_NATS_AUTH_TOKEN:-}
  VOXR_SVC_NATS_URL: ${VOXR_SVC_NATS_URL:-${VOXR_NATS_URL:-nats://nats:4222}}
  VOXR_SVC_SHARD_COUNT: "1"

  VOXR_SEARCH_ENGINE: meilisearch
  VOXR_SEARCH_URL: ${VOXR_SEARCH_URL:-http://meilisearch:7700}
  VOXR_SEARCH_API_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}

  VOXR_S3_ENDPOINT: ${VOXR_S3_ENDPOINT:-http://seaweedfs:8333}
  VOXR_S3_PUBLIC_ENDPOINT: ${VOXR_S3_PUBLIC_ENDPOINT:-${VOXR_S3_ENDPOINT:-http://seaweedfs:8333}}
  VOXR_S3_REGION: ${VOXR_S3_REGION:-us-east-1}
  VOXR_S3_ACCESS_KEY_ID: ${VOXR_S3_ACCESS_KEY:?set VOXR_S3_ACCESS_KEY in .env}
  VOXR_S3_SECRET_ACCESS_KEY: ${VOXR_S3_SECRET_KEY:?set VOXR_S3_SECRET_KEY in .env}
  VOXR_S3_FORCE_PATH_STYLE: "${VOXR_S3_FORCE_PATH_STYLE:-true}"
  VOXR_S3_BUCKET_CDN: ${VOXR_S3_BUCKET_CDN:-voxr}
  VOXR_S3_BUCKET_UPLOADS: ${VOXR_S3_BUCKET_UPLOADS:-voxr-uploads}
  VOXR_S3_BUCKET_DOWNLOADS: ${VOXR_S3_BUCKET_DOWNLOADS:-voxr-downloads}
  VOXR_S3_BUCKET_REPORTS: ${VOXR_S3_BUCKET_REPORTS:-voxr-reports}
  VOXR_S3_BUCKET_HARVESTS: ${VOXR_S3_BUCKET_HARVESTS:-voxr-harvests}
  AWS_ACCESS_KEY_ID: ${VOXR_S3_ACCESS_KEY:?set VOXR_S3_ACCESS_KEY in .env}
  AWS_SECRET_ACCESS_KEY: ${VOXR_S3_SECRET_KEY:?set VOXR_S3_SECRET_KEY in .env}
  AWS_DEFAULT_REGION: ${VOXR_S3_REGION:-us-east-1}
  AWS_EC2_METADATA_DISABLED: "true"

  VOXR_LIVEKIT_ENABLED: "${VOXR_LIVEKIT_ENABLED:-true}"
  VOXR_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
  VOXR_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
  VOXR_LIVEKIT_INTERNAL_URL: ${VOXR_LIVEKIT_INTERNAL_URL:-http://livekit:7880}
  VOXR_LIVEKIT_WEBHOOK_URL: http://api:8080/webhooks/livekit
  VOXR_LIVEKIT_DEFAULT_REGION: '{"id":"default","name":"Default","emoji":"🌍","latitude":0,"longitude":0}'
  VOXR_LIVEKIT_URL: ${VOXR_LIVEKIT_URL:-${VOXR_PUBLIC_ORIGIN:-${VOXR_PUBLIC_SCHEME:-https}://${VOXR_DOMAIN}:${VOXR_PUBLIC_PORT:-443}}/livekit}

  VOXR_KLIPY_API_KEY: ${VOXR_KLIPY_API_KEY:-}

  VOXR_EMAIL_ENABLED: ${VOXR_EMAIL_ENABLED:-false}
  VOXR_EMAIL_PROVIDER: ${VOXR_EMAIL_PROVIDER:-none}
  VOXR_EMAIL_FROM_EMAIL: ${VOXR_EMAIL_FROM_EMAIL:-noreply@localhost}
  VOXR_EMAIL_FROM_NAME: ${VOXR_EMAIL_FROM_NAME:-Voxr}
  VOXR_EMAIL_APP_BASE_URL: ${VOXR_EMAIL_APP_BASE_URL:-}
  VOXR_EMAIL_SMTP_HOST: ${VOXR_EMAIL_SMTP_HOST:-}
  VOXR_EMAIL_SMTP_PORT: ${VOXR_EMAIL_SMTP_PORT:-587}
  VOXR_EMAIL_SMTP_USERNAME: ${VOXR_EMAIL_SMTP_USERNAME:-}
  VOXR_EMAIL_SMTP_PASSWORD: ${VOXR_EMAIL_SMTP_PASSWORD:-}
  VOXR_EMAIL_SMTP_SECURE: ${VOXR_EMAIL_SMTP_SECURE:-true}

  VOXR_SMS_ENABLED: "${VOXR_SMS_ENABLED:-false}"
  VOXR_CAPTCHA_ENABLED: ${VOXR_CAPTCHA_ENABLED:-false}
  VOXR_CAPTCHA_PROVIDER: ${VOXR_CAPTCHA_PROVIDER:-none}
  VOXR_CAPTCHA_HCAPTCHA_SITE_KEY: ${VOXR_CAPTCHA_HCAPTCHA_SITE_KEY:-}
  VOXR_CAPTCHA_HCAPTCHA_SECRET_KEY: ${VOXR_CAPTCHA_HCAPTCHA_SECRET_KEY:-}
  VOXR_CAPTCHA_TURNSTILE_SITE_KEY: ${VOXR_CAPTCHA_TURNSTILE_SITE_KEY:-}
  VOXR_CAPTCHA_TURNSTILE_SECRET_KEY: ${VOXR_CAPTCHA_TURNSTILE_SECRET_KEY:-}
  VOXR_STRIPE_ENABLED: "${VOXR_STRIPE_ENABLED:-false}"
  VOXR_NCMEC_ENABLED: "${VOXR_NCMEC_ENABLED:-false}"
  VOXR_CLAMAV_ENABLED: "${VOXR_CLAMAV_ENABLED:-false}"
  VOXR_DISCOVERY_ENABLED: ${VOXR_DISCOVERY_ENABLED:-true}

  VOXR_SUDO_MODE_SECRET: ${VOXR_SUDO_MODE_SECRET:?set VOXR_SUDO_MODE_SECRET in .env}
  VOXR_CONNECTION_INITIATION_SECRET: ${VOXR_CONNECTION_INITIATION_SECRET:?set VOXR_CONNECTION_INITIATION_SECRET in .env}
  VOXR_SSO_ALLOW_PRIVATE_ADDRESSES: ${VOXR_SSO_ALLOW_PRIVATE_ADDRESSES:-false}
  VOXR_VAPID_PUBLIC_KEY: ${VOXR_VAPID_PUBLIC_KEY:?set VOXR_VAPID_PUBLIC_KEY in .env}
  VOXR_VAPID_PRIVATE_KEY: ${VOXR_VAPID_PRIVATE_KEY:?set VOXR_VAPID_PRIVATE_KEY in .env}
  VOXR_VAPID_EMAIL: ${VOXR_VAPID_EMAIL:-admin@${VOXR_DOMAIN}}
  VOXR_PASSKEY_RP_ID: ${VOXR_PASSKEY_RP_ID:-${VOXR_DOMAIN}}
  VOXR_PASSKEY_RP_NAME: ${VOXR_PASSKEY_RP_NAME:-Voxr}
  VOXR_PASSKEY_ADDITIONAL_ALLOWED_ORIGINS: ${VOXR_PASSKEY_ADDITIONAL_ALLOWED_ORIGINS:-${VOXR_PUBLIC_ORIGIN:-${VOXR_PUBLIC_SCHEME:-https}://${VOXR_DOMAIN}}}
  VOXR_GATEWAY_RPC_AUTH_TOKEN: ${VOXR_GATEWAY_RPC_AUTH_TOKEN:?set VOXR_GATEWAY_RPC_AUTH_TOKEN in .env}
  VOXR_MEDIA_PROXY_SECRET_KEY: ${VOXR_MEDIA_PROXY_SECRET_KEY:?set VOXR_MEDIA_PROXY_SECRET_KEY in .env}
  VOXR_MEDIA_PROXY_UPLOAD_RELAY_SECRET_BASE64: ${VOXR_MEDIA_PROXY_UPLOAD_RELAY_SECRET_BASE64:?set VOXR_MEDIA_PROXY_UPLOAD_RELAY_SECRET_BASE64 in .env}
  VOXR_ADMIN_SECRET_KEY_BASE: ${VOXR_ADMIN_SECRET_KEY_BASE:?set VOXR_ADMIN_SECRET_KEY_BASE in .env}
  VOXR_ADMIN_OAUTH_CLIENT_SECRET: ${VOXR_ADMIN_OAUTH_CLIENT_SECRET:?set VOXR_ADMIN_OAUTH_CLIENT_SECRET in .env}

  VOXR_INTERNAL_API_ENDPOINT: http://api:8080
  VOXR_INTERNAL_GATEWAY_ENDPOINT: http://gateway:8080
  VOXR_INTERNAL_MEDIA_PROXY_ENDPOINT: http://media-proxy:8080
  VOXR_MARKETING_ENDPOINT: ${VOXR_PUBLIC_ORIGIN:-${VOXR_PUBLIC_SCHEME:-https}://${VOXR_DOMAIN}}
  VOXR_MEDIA_PROXY_ENDPOINT: http://media-proxy:8080
  VOXR_MEDIA_ENDPOINT: ${VOXR_PUBLIC_ORIGIN:-${VOXR_PUBLIC_SCHEME:-https}://${VOXR_DOMAIN}}/media
  VOXR_MEDIA_PROXY_UPLOAD_RELAY_ENDPOINT: ${VOXR_PUBLIC_ORIGIN:-${VOXR_PUBLIC_SCHEME:-https}://${VOXR_DOMAIN}}/media

x-voxr-service: &voxr-service
  restart: unless-stopped
  networks: [voxr]

x-voxr-svc-healthcheck: &voxr-svc-healthcheck
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET /_health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 60s
  start_interval: 1s

services:
  edge:
    image: caddy:2.10-alpine
    deploy:
      resources:
        limits:
          memory: ${VOXR_CADDY_MEMORY_LIMIT:-256mb}
    restart: unless-stopped
    networks: [voxr]
    ports:
      - "${VOXR_HTTP_PORT:-80}:80"
      - "${VOXR_HTTPS_PORT:-443}:443"
      - "${VOXR_HTTPS_PORT:-443}:443/udp"
    environment:
      VOXR_EDGE_SITE_ADDRESS: ${VOXR_EDGE_SITE_ADDRESS:-${VOXR_CADDY_SITE_ADDRESS:-${VOXR_PUBLIC_SCHEME:-https}://${VOXR_DOMAIN:?set VOXR_DOMAIN in .env}}}
      VOXR_EDGE_TRUSTED_PROXIES: ${VOXR_EDGE_TRUSTED_PROXIES:-private_ranges}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - edge-data:/data
      - edge-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      api: {condition: service_started}
      gateway: {condition: service_healthy}
      media-proxy: {condition: service_started}
      static-proxy: {condition: service_started}
      admin: {condition: service_started}

  postgres:
    image: postgres:16-alpine
    deploy:
      resources:
        limits:
          memory: ${VOXR_POSTGRES_MEMORY_LIMIT:-5gb}
        reservations:
          memory: ${VOXR_POSTGRES_MEMORY_RESERVATION:-3gb}
    restart: unless-stopped
    networks: [voxr]
    command: >
      postgres
      -c max_connections=${VOXR_POSTGRES_SERVER_MAX_CONNECTIONS:-150}
      -c shared_buffers=${VOXR_POSTGRES_SHARED_BUFFERS:-512MB}
      -c effective_cache_size=${VOXR_POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}
      -c work_mem=${VOXR_POSTGRES_WORK_MEM:-8MB}
      -c maintenance_work_mem=${VOXR_POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
      -c autovacuum_work_mem=${VOXR_POSTGRES_AUTOVACUUM_WORK_MEM:-128MB}
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c default_statistics_target=200
      -c jit=off
      -c min_wal_size=512MB
      -c max_wal_size=2GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c wal_compression=zstd
      -c bgwriter_delay=50ms
      -c bgwriter_lru_maxpages=1000
      -c autovacuum_vacuum_scale_factor=0.05
      -c autovacuum_analyze_scale_factor=0.02
      -c autovacuum_vacuum_cost_limit=2000
      -c track_io_timing=on
      -c shared_preload_libraries=pg_stat_statements
    shm_size: 256mb
    environment:
      POSTGRES_DB: voxr
      POSTGRES_USER: voxr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxr -d voxr"]
      interval: 10s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8.1-alpine
    deploy:
      resources:
        limits:
          memory: ${VOXR_VALKEY_MEMORY_LIMIT:-256mb}
    restart: unless-stopped
    networks: [voxr]
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec", "--dir", "/data",
              "--maxmemory", "${VOXR_VALKEY_MAXMEMORY:-192mb}",
              "--maxmemory-policy", "${VOXR_VALKEY_MAXMEMORY_POLICY:-noeviction}"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.14-alpine
    deploy:
      resources:
        limits:
          memory: ${VOXR_NATS_MEMORY_LIMIT:-256mb}
    restart: unless-stopped
    networks: [voxr]
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.12
    deploy:
      resources:
        limits:
          memory: ${VOXR_MEILISEARCH_MEMORY_LIMIT:-768mb}
    restart: unless-stopped
    networks: [voxr]
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: ${VOXR_MEILISEARCH_MAX_INDEXING_MEMORY:-384mb}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.34
    deploy:
      resources:
        limits:
          memory: ${VOXR_SEAWEEDFS_MEMORY_LIMIT:-2gb}
    restart: unless-stopped
    networks: [voxr]
    environment:
      GOMEMLIMIT: ${VOXR_SEAWEEDFS_GOMEMLIMIT:-1536MiB}
    command: ["server", "-s3", "-dir=/data"]
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.34
    deploy:
      resources:
        limits:
          memory: ${VOXR_SEAWEEDFS_INIT_MEMORY_LIMIT:-128mb}
    networks: [voxr]
    depends_on:
      seaweedfs: {condition: service_healthy}
    restart: "no"
    environment:
      VOXR_S3_ACCESS_KEY: ${VOXR_S3_ACCESS_KEY:?set VOXR_S3_ACCESS_KEY in .env}
      VOXR_S3_SECRET_KEY: ${VOXR_S3_SECRET_KEY:?set VOXR_S3_SECRET_KEY in .env}
      VOXR_S3_BUCKET_CDN: ${VOXR_S3_BUCKET_CDN:-voxr}
      VOXR_S3_BUCKET_UPLOADS: ${VOXR_S3_BUCKET_UPLOADS:-voxr-uploads}
      VOXR_S3_BUCKET_DOWNLOADS: ${VOXR_S3_BUCKET_DOWNLOADS:-voxr-downloads}
      VOXR_S3_BUCKET_REPORTS: ${VOXR_S3_BUCKET_REPORTS:-voxr-reports}
      VOXR_S3_BUCKET_HARVESTS: ${VOXR_S3_BUCKET_HARVESTS:-voxr-harvests}
    entrypoint:
      - /bin/sh
      - -c
      - >
        buckets="$$VOXR_S3_BUCKET_CDN $$VOXR_S3_BUCKET_UPLOADS $$VOXR_S3_BUCKET_DOWNLOADS $$VOXR_S3_BUCKET_REPORTS $$VOXR_S3_BUCKET_HARVESTS";
        missing="$$buckets";
        for attempt in $$(seq 1 60); do
          if ! nc -z seaweedfs 9333 2>/dev/null; then
            sleep 2;
            continue;
          fi;
          listed=$$(echo "s3.bucket.list" | timeout 10 weed shell -master=seaweedfs:9333 2>&1);
          missing="";
          for b in $$buckets; do
            echo "$$listed" | grep -q "^[[:space:]]*$$b[[:space:]]" || missing="$${missing:+$$missing }$$b";
          done;
          if [ -z "$$missing" ]; then
            if ! echo "s3.configure -user=voxr -access_key=$$VOXR_S3_ACCESS_KEY -secret_key=$$VOXR_S3_SECRET_KEY -actions=Admin,Read,Write,List,Tagging -apply" | timeout 10 weed shell -master=seaweedfs:9333 >/dev/null 2>&1; then
              echo "seaweedfs-init could not configure the S3 identity" >&2;
              exit 1;
            fi;
            echo "buckets ready";
            exit 0;
          fi;
          for b in $$missing; do
            echo "s3.bucket.create -name $$b" | timeout 10 weed shell -master=seaweedfs:9333 >/dev/null 2>&1;
          done;
          sleep 2;
        done;
        echo "seaweedfs-init could not verify buckets: $$missing" >&2;
        exit 1;

  livekit:
    image: livekit/livekit-server:v1.12.0
    deploy:
      resources:
        limits:
          memory: ${VOXR_LIVEKIT_MEMORY_LIMIT:-512mb}
    restart: unless-stopped
    networks: [voxr]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}"
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: ${VOXR_LIVEKIT_TCP_PORT:-7881}
          udp_port: ${VOXR_LIVEKIT_UDP_PORT:-7882}
          use_external_ip: ${VOXR_LIVEKIT_USE_EXTERNAL_IP:-true}
          node_ip: "${VOXR_LIVEKIT_NODE_IP:-}"
          stun_servers:
            - ${VOXR_LIVEKIT_STUN_PRIMARY:-stun.l.google.com:19302}
            - ${VOXR_LIVEKIT_STUN_SECONDARY:-stun1.l.google.com:19302}
        webhook:
          api_key: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
          urls:
            - http://api:8080/webhooks/livekit
    ports:
      - "${VOXR_LIVEKIT_TCP_PORT:-7881}:${VOXR_LIVEKIT_TCP_PORT:-7881}"
      - "${VOXR_LIVEKIT_UDP_PORT:-7882}:${VOXR_LIVEKIT_UDP_PORT:-7882}/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    <<: *voxr-service
    image: ${VOXR_REGISTRY:-ghcr.io/${VOXR_REGISTRY_OWNER:-voxrapp}}/voxr-api:${VOXR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${VOXR_API_MEMORY_LIMIT:-2560mb}
        reservations:
          memory: ${VOXR_API_MEMORY_RESERVATION:-1gb}
    environment:
      <<: *voxr-env
      VOXR_API_PORT: "8080"
      NODE_OPTIONS: --enable-source-maps${VOXR_API_NODE_HEAP_MB:+ --max-old-space-size=$VOXR_API_NODE_HEAP_MB}
      VOXR_API_PRESIGNED_ATTACHMENT_UPLOADS_ENABLED: "true"
      VOXR_POSTGRES_MAX_CONNECTIONS: "25"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
      start_interval: 1s
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_healthy}
      nats: {condition: service_healthy}
      meilisearch: {condition: service_healthy}
      seaweedfs-init: {condition: service_completed_successfully}
      gifs: {condition: service_healthy}
      gifs-shard: {condition: service_healthy}
      snowflakes: {condition: service_healthy}
      snowflakes-shard: {condition: service_healthy}
      messages: {condition: service_healthy}
      messages-shard: {condition: service_healthy}
      users: {condition: service_healthy}
      users-shard: {condition: service_healthy}

  worker:
    <<: *voxr-service
    image: ${VOXR_REGISTRY:-ghcr.io/${VOXR_REGISTRY_OWNER:-voxrapp}}/voxr-api:${VOXR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${VOXR_WORKER_MEMORY_LIMIT:-2560mb}
        reservations:
          memory: ${VOXR_WORKER_MEMORY_RESERVATION:-1gb}
    working_dir: /usr/src/app/voxr_api
    command: ["sh", "-c", "if [ -f dist/WorkerEntrypoint.js ]; then exec node dist/WorkerEntrypoint.js; else exec ./node_modules/.bin/tsx src/WorkerEntrypoint.ts; fi"]
    environment:
      <<: *voxr-env
      NODE_OPTIONS: --enable-source-maps${VOXR_WORKER_NODE_HEAP_MB:+ --max-old-space-size=$VOXR_WORKER_NODE_HEAP_MB}
      VOXR_API_WORKER_MODE: all_lanes
      VOXR_API_WORKER_ENABLE_CRON_SCHEDULER: "true"
      VOXR_API_WORKER_ENABLE_VOICE_RECONCILIATION: "true"
      VOXR_POSTGRES_MAX_CONNECTIONS: "25"
    healthcheck:
      test: ["CMD", "node", "-e", "const age=Date.now()-require('node:fs').statSync('/tmp/voxr-worker-heartbeat').mtimeMs;if(age>30000){console.error('worker heartbeat is '+Math.round(age)+'ms old');process.exit(1)}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
      start_interval: 1s
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_healthy}
      nats: {condition: service_healthy}
      seaweedfs-init: {condition: service_completed_successfully}
      snowflakes-shard: {condition: service_healthy}
      messages-shard: {condition: service_healthy}
      users-shard: {condition: service_healthy}

  gateway:
    <<: *voxr-service
    image: ${VOXR_REGISTRY:-ghcr.io/${VOXR_REGISTRY_OWNER:-voxrapp}}/voxr-gateway:${VOXR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${VOXR_GATEWAY_MEMORY_LIMIT:-1gb}
        reservations:
          memory: ${VOXR_GATEWAY_MEMORY_RESERVATION:-384mb}
    environment:
      <<: *voxr-env
      VOXR_GATEWAY_PORT: "8080"
      VOXR_GATEWAY_MEDIA_PROXY_ENDPOINT: ${VOXR_PUBLIC_ORIGIN:-${VOXR_PUBLIC_SCHEME:-https}://${VOXR_DOMAIN}}/media
      VOXR_GATEWAY_STATIC_CDN_ENDPOINT: ${VOXR_PUBLIC_ORIGIN:-${VOXR_PUBLIC_SCHEME:-https}://${VOXR_DOMAIN}}
      VOXR_GATEWAY_LOGGER_LEVEL: info
      VOXR_ERLANG_COOKIE: ${VOXR_ERLANG_COOKIE:?set VOXR_ERLANG_COOKIE in .env}
      VOXR_ERLANG_SCHEDULERS_MIN: "${VOXR_ERLANG_SCHEDULERS_MIN:-2}"
      VOXR_ERLANG_SCHEDULERS_MAX: "${VOXR_ERLANG_SCHEDULERS_MAX:-16}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/_health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    depends_on:
      nats: {condition: service_healthy}
      valkey: {condition: service_healthy}

  media-proxy:
    <<: *voxr-service
    image: ${VOXR_REGISTRY:-ghcr.io/${VOXR_REGISTRY_OWNER:-voxrapp}}/voxr-media-proxy:${VOXR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${VOXR_MEDIA_PROXY_MEMORY_LIMIT:-512mb}
    environment:
      <<: *voxr-env
      VOXR_MEDIA_PROXY_HOST: 0.0.0.0
      VOXR_MEDIA_PROXY_PORT: "8080"
      VOXR_MEDIA_PROXY_MODE: upload
      VOXR_MEDIA_PROXY_STORAGE_BACKEND: s3
      VOXR_MEDIA_PROXY_PUBLIC_ENDPOINT: ${VOXR_PUBLIC_ORIGIN:-${VOXR_PUBLIC_SCHEME:-https}://${VOXR_DOMAIN}}/media
      VOXR_S3_READ_SIGNED: "true"
    depends_on:
      seaweedfs-init: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

  static-proxy:
    <<: *voxr-service
    image: ${VOXR_REGISTRY:-ghcr.io/${VOXR_REGISTRY_OWNER:-voxrapp}}/voxr-static:${VOXR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${VOXR_STATIC_PROXY_MEMORY_LIMIT:-256mb}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/avatars/0.png"]
      interval: 10s
      timeout: 5s
      retries: 10

  app-proxy:
    <<: *voxr-service
    image: ${VOXR_REGISTRY:-ghcr.io/${VOXR_REGISTRY_OWNER:-voxrapp}}/voxr-app-proxy-self-hosted:${VOXR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${VOXR_APP_PROXY_MEMORY_LIMIT:-256mb}
    environment:
      VOXR_APP_PROXY_HOST: 0.0.0.0
      VOXR_APP_PROXY_PORT: "8080"
      VOXR_BASE_DOMAIN: ${VOXR_DOMAIN:?set VOXR_DOMAIN in .env}
      VOXR_PUBLIC_SCHEME: ${VOXR_PUBLIC_SCHEME:-https}
      VOXR_PUBLIC_PORT: ${VOXR_PUBLIC_PORT:-443}
      VOXR_PUBLIC_ORIGIN: ${VOXR_PUBLIC_ORIGIN:-}
      DISCOVERY_UPSTREAM_URL: http://edge:8088/.well-known/voxr
      PUBLIC_BOOTSTRAP_API_ENDPOINT: /api
      PUBLIC_BOOTSTRAP_API_PUBLIC_ENDPOINT: ${VOXR_PUBLIC_ORIGIN:-${VOXR_PUBLIC_SCHEME:-https}://${VOXR_DOMAIN}}/api
      VOXR_CSP_EXTRA_DEFAULT_SRC: ${VOXR_CSP_EXTRA_DEFAULT_SRC:-}
      VOXR_CSP_EXTRA_CONNECT_SRC: ${VOXR_CSP_EXTRA_CONNECT_SRC:-}
      VOXR_CSP_EXTRA_IMG_SRC: ${VOXR_CSP_EXTRA_IMG_SRC:-}
      VOXR_CSP_EXTRA_MEDIA_SRC: ${VOXR_CSP_EXTRA_MEDIA_SRC:-}
      VOXR_CSP_EXTRA_FONT_SRC: ${VOXR_CSP_EXTRA_FONT_SRC:-}
      VOXR_CSP_EXTRA_SCRIPT_SRC: ${VOXR_CSP_EXTRA_SCRIPT_SRC:-}
      VOXR_CSP_EXTRA_STYLE_SRC: ${VOXR_CSP_EXTRA_STYLE_SRC:-}
      VOXR_CSP_EXTRA_FRAME_SRC: ${VOXR_CSP_EXTRA_FRAME_SRC:-}
      VOXR_CSP_EXTRA_WORKER_SRC: ${VOXR_CSP_EXTRA_WORKER_SRC:-}
      VOXR_CSP_EXTRA_MANIFEST_SRC: ${VOXR_CSP_EXTRA_MANIFEST_SRC:-}
      VOXR_CSP_REPORT_URI: ${VOXR_CSP_REPORT_URI:-}
    depends_on:
      api: {condition: service_healthy}
      edge: {condition: service_healthy}

  snowflakes:
    <<: *voxr-service
    image: ${VOXR_REGISTRY:-ghcr.io/${VOXR_REGISTRY_OWNER:-voxrapp}}/voxr-snowflakes:${VOXR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${VOXR_SNOWFLAKES_MEMORY_LIMIT:-128mb}
    environment:
      <<: *voxr-env
      VOXR_SVC_NAME: snowflakes
      VOXR_SVC_MODE: router
    healthcheck: *voxr-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}

  snowflakes-shard:
    <<: *voxr-service
    image: ${VOXR_REGISTRY:-ghcr.io/${VOXR_REGISTRY_OWNER:-voxrapp}}/voxr-snowflakes:${VOXR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${VOXR_SNOWFLAKES_SHARD_MEMORY_LIMIT:-256mb}
    environment:
      <<: *voxr-env
      VOXR_SVC_NAME: snowflakes
      VOXR_SVC_MODE: shard
      VOXR_SVC_SHARD_ID: "0"
    healthcheck: *voxr-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}

  users:
    <<: *voxr-service
    image: ${VOXR_REGISTRY:-ghcr.io/${VOXR_REGISTRY_OWNER:-voxrapp}}/voxr-users:${VOXR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${VOXR_USERS_MEMORY_LIMIT:-128mb}
    environment:
      <<: *voxr-env
      VOXR_SVC_NAME: users
      VOXR_SVC_MODE: router
      VOXR_SVC_MAX_CONCURRENT_REQUESTS: "${VOXR_SVC_MAX_CONCURRENT_REQUESTS:-20}"
    healthcheck: *voxr-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}

  users-shard:
    <<: *voxr-service
    image: ${VOXR_REGISTRY:-ghcr.io/${VOXR_REGISTRY_OWNER:-voxrapp}}/voxr-users:${VOXR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${VOXR_USERS_SHARD_MEMORY_LIMIT:-256mb}
    environment:
      <<: *voxr-env
      VOXR_SVC_NAME: users
      VOXR_SVC_MODE: shard
      VOXR_SVC_SHARD_ID: "0"
      VOXR_POSTGRES_MAX_CONNECTIONS: "20"
      VOXR_SVC_MAX_CONCURRENT_REQUESTS: "${VOXR_SVC_MAX_CONCURRENT_REQUESTS:-20}"
    healthcheck: *voxr-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}
      postgres: {condition: service_healthy}

  gifs:
    <<: *voxr-service
    image: ${VOXR_REGISTRY:-ghcr.io/${VOXR_REGISTRY_OWNER:-voxrapp}}/voxr-gifs:${VOXR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${VOXR_GIFS_MEMORY_LIMIT:-128mb}
    environment:
      <<: *voxr-env
      VOXR_SVC_NAME: gifs
      VOXR_SVC_MODE: router
      VOXR_MEDIA_PROXY_PUBLIC_ENDPOINT: ${VOXR_PUBLIC_ORIGIN:-${VOXR_PUBLIC_SCHEME:-https}://${VOXR_DOMAIN}}/media
    healthcheck: *voxr-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}

  gifs-shard:
    <<: *voxr-service
    image: ${VOXR_REGISTRY:-ghcr.io/${VOXR_REGISTRY_OWNER:-voxrapp}}/voxr-gifs:${VOXR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${VOXR_GIFS_SHARD_MEMORY_LIMIT:-256mb}
    environment:
      <<: *voxr-env
      VOXR_SVC_NAME: gifs
      VOXR_SVC_MODE: shard
      VOXR_SVC_SHARD_ID: "0"
      VOXR_MEDIA_PROXY_PUBLIC_ENDPOINT: ${VOXR_PUBLIC_ORIGIN:-${VOXR_PUBLIC_SCHEME:-https}://${VOXR_DOMAIN}}/media
    healthcheck: *voxr-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}

  messages:
    <<: *voxr-service
    image: ${VOXR_REGISTRY:-ghcr.io/${VOXR_REGISTRY_OWNER:-voxrapp}}/voxr-messages:${VOXR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${VOXR_MESSAGES_MEMORY_LIMIT:-128mb}
    environment:
      <<: *voxr-env
      VOXR_SVC_NAME: messages
      VOXR_SVC_MODE: router
      VOXR_SVC_MAX_CONCURRENT_REQUESTS: "${VOXR_SVC_MAX_CONCURRENT_REQUESTS:-20}"
    healthcheck: *voxr-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}

  messages-shard:
    <<: *voxr-service
    image: ${VOXR_REGISTRY:-ghcr.io/${VOXR_REGISTRY_OWNER:-voxrapp}}/voxr-messages:${VOXR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${VOXR_MESSAGES_SHARD_MEMORY_LIMIT:-256mb}
    environment:
      <<: *voxr-env
      VOXR_SVC_NAME: messages
      VOXR_SVC_MODE: shard
      VOXR_SVC_SHARD_ID: "0"
      VOXR_POSTGRES_MAX_CONNECTIONS: "20"
      VOXR_SVC_MAX_CONCURRENT_REQUESTS: "${VOXR_SVC_MAX_CONCURRENT_REQUESTS:-20}"
    healthcheck: *voxr-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}
      postgres: {condition: service_healthy}

  unfurl:
    <<: *voxr-service
    image: ${VOXR_REGISTRY:-ghcr.io/${VOXR_REGISTRY_OWNER:-voxrapp}}/voxr-unfurl:${VOXR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${VOXR_UNFURL_MEMORY_LIMIT:-128mb}
    environment:
      <<: *voxr-env
      VOXR_SVC_NAME: unfurl
      VOXR_SVC_MODE: router
      VOXR_MEDIA_PROXY_PUBLIC_ENDPOINT: ${VOXR_PUBLIC_ORIGIN:-${VOXR_PUBLIC_SCHEME:-https}://${VOXR_DOMAIN}}/media
      VOXR_STATIC_CDN_ENDPOINT: ${VOXR_PUBLIC_ORIGIN:-${VOXR_PUBLIC_SCHEME:-https}://${VOXR_DOMAIN}}
    healthcheck: *voxr-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}

  unfurl-shard:
    <<: *voxr-service
    image: ${VOXR_REGISTRY:-ghcr.io/${VOXR_REGISTRY_OWNER:-voxrapp}}/voxr-unfurl:${VOXR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${VOXR_UNFURL_SHARD_MEMORY_LIMIT:-256mb}
    environment:
      <<: *voxr-env
      VOXR_SVC_NAME: unfurl
      VOXR_SVC_MODE: shard
      VOXR_SVC_SHARD_ID: "0"
      VOXR_MEDIA_PROXY_PUBLIC_ENDPOINT: ${VOXR_PUBLIC_ORIGIN:-${VOXR_PUBLIC_SCHEME:-https}://${VOXR_DOMAIN}}/media
      VOXR_STATIC_CDN_ENDPOINT: ${VOXR_PUBLIC_ORIGIN:-${VOXR_PUBLIC_SCHEME:-https}://${VOXR_DOMAIN}}
    healthcheck: *voxr-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}

  admin:
    <<: *voxr-service
    image: ${VOXR_REGISTRY:-ghcr.io/${VOXR_REGISTRY_OWNER:-voxrapp}}/voxr-admin:${VOXR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${VOXR_ADMIN_MEMORY_LIMIT:-256mb}
    environment:
      <<: *voxr-env
      VOXR_ADMIN_HOST: 0.0.0.0
      VOXR_ADMIN_PORT: "8080"
      VOXR_ADMIN_BASE_PATH: /admin
      VOXR_API_ENDPOINT: http://api:8080
      VOXR_ADMIN_ENDPOINT: ${VOXR_PUBLIC_ORIGIN:-${VOXR_PUBLIC_SCHEME:-https}://${VOXR_DOMAIN}}/admin
      VOXR_APP_ENDPOINT: ${VOXR_PUBLIC_ORIGIN:-${VOXR_PUBLIC_SCHEME:-https}://${VOXR_DOMAIN}}
      VOXR_MEDIA_ENDPOINT: ${VOXR_PUBLIC_ORIGIN:-${VOXR_PUBLIC_SCHEME:-https}://${VOXR_DOMAIN}}/media
      VOXR_STATIC_CDN_ENDPOINT: ${VOXR_PUBLIC_ORIGIN:-${VOXR_PUBLIC_SCHEME:-https}://${VOXR_DOMAIN}}
      VOXR_ADMIN_OAUTH_REDIRECT_URI: ${VOXR_PUBLIC_ORIGIN:-${VOXR_PUBLIC_SCHEME:-https}://${VOXR_DOMAIN}}/admin/oauth2_callback
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /_health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
      start_interval: 1s
    depends_on:
      api: {condition: service_healthy}

networks:
  voxr:
    driver: bridge

volumes:
  edge-data:
  edge-config:
  postgres-data:
  valkey-data:
  nats-data:
  meilisearch-data:
  seaweedfs-data:
