# SPDX-License-Identifier: AGPL-3.0-or-later
name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GHCR_REGISTRY: ghcr.io/${{ github.repository_owner }}
  CARGO_PROFILE_DEV_DEBUG: none
  CARGO_PROFILE_TEST_DEBUG: none
  CARGO_INCREMENTAL: '0'

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VOXR_CI_BIN: ${{ github.workspace }}/target/debug/voxr-ci
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Rust toolchain (CI helpers)
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.93.0"
          targets: wasm32-unknown-unknown

      - name: Restore ci helper
        id: ci-helper
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/debug/voxr-ci
          key: >-
            voxr-ci-bin-${{ runner.os }}-1.93.0-${{ hashFiles('Cargo.lock', 'Cargo.toml',
            'tools/ci/Cargo.toml', 'tools/ci/src/**', 'tools/ci/templates/**') }}

      - name: Build ci helper
        if: steps.ci-helper.outputs.cache-hit != 'true'
        run: cargo build --locked --package voxr-ci

      - name: Save ci helper
        if: github.ref == 'refs/heads/main' && steps.ci-helper.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/debug/voxr-ci
          key: >-
            voxr-ci-bin-${{ runner.os }}-1.93.0-${{ hashFiles('Cargo.lock', 'Cargo.toml',
            'tools/ci/Cargo.toml', 'tools/ci/src/**', 'tools/ci/templates/**') }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          "$VOXR_CI_BIN" ci --step install_dependencies

      - name: Run typecheck
        run: |
          "$VOXR_CI_BIN" ci --step typecheck

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VOXR_CI_BIN: ${{ github.workspace }}/target/debug/voxr-ci
      PNPM_TEST_WORKSPACE_CONCURRENCY: '2'
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Rust toolchain (CI helpers)
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.93.0"
          targets: wasm32-unknown-unknown

      - name: Restore ci helper
        id: ci-helper
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/debug/voxr-ci
          key: >-
            voxr-ci-bin-${{ runner.os }}-1.93.0-${{ hashFiles('Cargo.lock', 'Cargo.toml',
            'tools/ci/Cargo.toml', 'tools/ci/src/**', 'tools/ci/templates/**') }}

      - name: Build ci helper
        if: steps.ci-helper.outputs.cache-hit != 'true'
        run: cargo build --locked --package voxr-ci

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          "$VOXR_CI_BIN" ci --step install_dependencies

      - name: Restore voxr_app wasm artifacts
        id: app-wasm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            voxr_app/pkgs/libfluxcore
            voxr_app/src/features/messaging/utils/markdown/parser/MarkdownParserWasmBytes.ts
          key: >-
            app-wasm-${{ runner.os }}-1.93.0-${{ hashFiles('Cargo.lock', 'tools/ci/src/app_wasm.rs',
            'tools/ci/templates/libfluxcore_wrapper.js', 'tools/ci/templates/libfluxcore_wrapper.d.ts',
            'voxr_app/rust/libfluxcore/Cargo.toml', 'voxr_app/rust/libfluxcore/Cargo.lock',
            'voxr_app/rust/libfluxcore/.cargo/config.toml', 'voxr_app/rust/libfluxcore/src/**',
            'packages/markdown_parser/rust/Cargo.toml', 'packages/markdown_parser/rust/.cargo/config.toml',
            'packages/markdown_parser/rust/src/**') }}

      - name: Run tests
        run: |
          "$VOXR_CI_BIN" ci --step test

      - name: Save voxr_app wasm artifacts
        if: always() && github.ref == 'refs/heads/main' && steps.app-wasm.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            voxr_app/pkgs/libfluxcore
            voxr_app/src/features/messaging/utils/markdown/parser/MarkdownParserWasmBytes.ts
          key: >-
            app-wasm-${{ runner.os }}-1.93.0-${{ hashFiles('Cargo.lock', 'tools/ci/src/app_wasm.rs',
            'tools/ci/templates/libfluxcore_wrapper.js', 'tools/ci/templates/libfluxcore_wrapper.d.ts',
            'voxr_app/rust/libfluxcore/Cargo.toml', 'voxr_app/rust/libfluxcore/Cargo.lock',
            'voxr_app/rust/libfluxcore/.cargo/config.toml', 'voxr_app/rust/libfluxcore/src/**',
            'packages/markdown_parser/rust/Cargo.toml', 'packages/markdown_parser/rust/.cargo/config.toml',
            'packages/markdown_parser/rust/src/**') }}

  rust:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.93.0"
          components: clippy, rustfmt

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('voxr_media_proxy/tools/install-native-deps.sh') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('voxr_media_proxy/tools/install-native-deps.sh') }}-

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.6 --locked

      - name: Check Rust dependencies
        run: cargo deny --locked check -D warnings

      - name: Check desktop native dependencies
        run: tools/ci/check-desktop-native-workspaces.sh dependencies

      - name: Cache native media dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /opt/voxr-native
          key: media-native-${{ runner.os }}-${{ hashFiles('voxr_media_proxy/tools/install-native-deps.sh') }}

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils \
            clang \
            cmake \
            curl \
            libaom-dev \
            libavfilter-dev \
            libclang-dev \
            libcurl4-openssl-dev \
            libdav1d-dev \
            libde265-dev \
            libfido2-dev \
            libheif-dev \
            liblcms2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libssl-dev \
            libudev-dev \
            libvips-dev \
            libwebp-dev \
            libyuv-dev \
            meson \
            nasm \
            ninja-build \
            pkg-config \
            xz-utils \
            yasm \
            zlib1g-dev
          sudo voxr_media_proxy/tools/install-native-deps.sh /opt/voxr-native
          echo "PKG_CONFIG_PATH=/opt/voxr-native/lib/pkgconfig:/opt/voxr-native/lib64/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/voxr-native/lib:/opt/voxr-native/lib64" >> "$GITHUB_ENV"
          echo "/opt/voxr-native/bin" >> "$GITHUB_PATH"

      - name: Install Node.js dependencies
        run: pnpm --filter voxr_admin install

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check formatting (desktop native workspaces)
        run: tools/ci/check-desktop-native-workspaces.sh fmt

      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Clippy (desktop native workspaces on Linux, warnings as errors)
        run: tools/ci/check-desktop-native-workspaces.sh clippy

      - name: Verify the source-built ffmpeg CLI is on PATH
        run: |
          set -euo pipefail
          command -v ffmpeg
          test "$(command -v ffmpeg)" = /opt/voxr-native/bin/ffmpeg
          ffmpeg -hide_banner -version

      - name: Run tests
        env:
          VOXR_REQUIRE_MEDIA_FIXTURES: "1"
        run: cargo test --workspace --all-features --locked

      - name: Run desktop native workspace tests on Linux
        run: tools/ci/check-desktop-native-workspaces.sh test

  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VOXR_CI_BIN: ${{ github.workspace }}/target/debug/voxr-ci
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Rust toolchain (CI helpers)
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.93.0"

      - name: Cache cargo (gateway NIFs)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            voxr_gateway/native/guild_member_list_oset_nif -> target
            voxr_gateway/native/push_markdown_plaintext_nif -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore ci helper
        id: ci-helper
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/debug/voxr-ci
          key: >-
            voxr-ci-bin-${{ runner.os }}-1.93.0-${{ hashFiles('Cargo.lock', 'Cargo.toml',
            'tools/ci/Cargo.toml', 'tools/ci/src/**', 'tools/ci/templates/**') }}

      - name: Build ci helper
        if: steps.ci-helper.outputs.cache-hit != 'true'
        run: cargo build --locked --package voxr-ci

      - name: Set up Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28'
          rebar3-version: '3.24.0'

      - name: Restore rebar3 dependencies
        id: rebar3-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/rebar3
            voxr_gateway/_build
            !voxr_gateway/_build/default/lib/voxr_gateway/**
            !voxr_gateway/_build/test/lib/voxr_gateway/**
          key: >-
            rebar3-${{ runner.os }}-otp28-rebar3.24.0-${{ hashFiles('voxr_gateway/rebar.lock',
            'voxr_gateway/rebar.config') }}
          restore-keys: |
            rebar3-${{ runner.os }}-otp28-rebar3.24.0-

      - name: Check formatting
        run: |
          "$VOXR_CI_BIN" ci --step gateway_fmt

      - name: Compile
        run: |
          "$VOXR_CI_BIN" ci --step gateway_compile

      - name: Run dialyzer
        run: |
          "$VOXR_CI_BIN" ci --step gateway_dialyzer

      - name: Run eunit tests
        run: |
          "$VOXR_CI_BIN" ci --step gateway_eunit

      - name: Save rebar3 dependencies
        if: always() && github.ref == 'refs/heads/main' && steps.rebar3-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/rebar3
            voxr_gateway/_build
            !voxr_gateway/_build/default/lib/voxr_gateway/**
            !voxr_gateway/_build/test/lib/voxr_gateway/**
          key: >-
            rebar3-${{ runner.os }}-otp28-rebar3.24.0-${{ hashFiles('voxr_gateway/rebar.lock',
            'voxr_gateway/rebar.config') }}

  knip:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VOXR_CI_BIN: ${{ github.workspace }}/target/debug/voxr-ci
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Rust toolchain (CI helpers)
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.93.0"
          targets: wasm32-unknown-unknown

      - name: Restore ci helper
        id: ci-helper
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/debug/voxr-ci
          key: >-
            voxr-ci-bin-${{ runner.os }}-1.93.0-${{ hashFiles('Cargo.lock', 'Cargo.toml',
            'tools/ci/Cargo.toml', 'tools/ci/src/**', 'tools/ci/templates/**') }}

      - name: Build ci helper
        if: steps.ci-helper.outputs.cache-hit != 'true'
        run: cargo build --locked --package voxr-ci

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          "$VOXR_CI_BIN" ci --step install_dependencies

      - name: Restore voxr_app wasm artifacts
        id: app-wasm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            voxr_app/pkgs/libfluxcore
            voxr_app/src/features/messaging/utils/markdown/parser/MarkdownParserWasmBytes.ts
          key: >-
            app-wasm-${{ runner.os }}-1.93.0-${{ hashFiles('Cargo.lock', 'tools/ci/src/app_wasm.rs',
            'tools/ci/templates/libfluxcore_wrapper.js', 'tools/ci/templates/libfluxcore_wrapper.d.ts',
            'voxr_app/rust/libfluxcore/Cargo.toml', 'voxr_app/rust/libfluxcore/Cargo.lock',
            'voxr_app/rust/libfluxcore/.cargo/config.toml', 'voxr_app/rust/libfluxcore/src/**',
            'packages/markdown_parser/rust/Cargo.toml', 'packages/markdown_parser/rust/.cargo/config.toml',
            'packages/markdown_parser/rust/src/**') }}

      - name: Run knip
        run: |
          "$VOXR_CI_BIN" ci --step knip

      - name: Save voxr_app wasm artifacts
        if: always() && github.ref == 'refs/heads/main' && steps.app-wasm.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            voxr_app/pkgs/libfluxcore
            voxr_app/src/features/messaging/utils/markdown/parser/MarkdownParserWasmBytes.ts
          key: >-
            app-wasm-${{ runner.os }}-1.93.0-${{ hashFiles('Cargo.lock', 'tools/ci/src/app_wasm.rs',
            'tools/ci/templates/libfluxcore_wrapper.js', 'tools/ci/templates/libfluxcore_wrapper.d.ts',
            'voxr_app/rust/libfluxcore/Cargo.toml', 'voxr_app/rust/libfluxcore/Cargo.lock',
            'voxr_app/rust/libfluxcore/.cargo/config.toml', 'voxr_app/rust/libfluxcore/src/**',
            'packages/markdown_parser/rust/Cargo.toml', 'packages/markdown_parser/rust/.cargo/config.toml',
            'packages/markdown_parser/rust/src/**') }}

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm exec biome ci .

      - name: Lint JSX for browser-translation safety
        run: pnpm exec eslint . --max-warnings 0

  i18n:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile locale catalogs
        run: pnpm i18n:compile

      - name: Check drift of compiled locale modules
        run: |
          if ! git diff --exit-code -- \
            packages/errors/src/i18n/locales \
            packages/errors/src/i18n/ErrorI18nTypes.generated.ts \
            voxr_api/pkgs/email/src/email_i18n/locales \
            voxr_api/pkgs/email/src/email_i18n/EmailI18nTypes.generated.ts \
            voxr_api/src/api/content_i18n/locales; then
            echo "::error::Compiled locale modules are outdated. Run 'pnpm i18n:compile' and commit the result. Translations belong in the weblate/ catalogs, not in the generated locales/ modules."
            exit 1
          fi

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter voxr_docs...

      - name: Verify documentation matches the live API
        run: pnpm --filter voxr_docs verify

      - name: Build documentation
        run: pnpm --filter voxr_docs build

  fonts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Install font tooling
        run: python3 -m pip install -r tools/fonts/requirements.txt

      - name: Verify shipped fonts match the lockfile
        run: python3 tools/fonts/build_fonts.py --verify
